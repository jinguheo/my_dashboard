<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; padding: 16px; width: 220px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    #status { font-size: 12px; color: #555; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
    .green { background:#22c55e; }
    .red { background:#ef4444; }
  </style>
</head>
<body>
  <h3>🔗 Dashboard Bridge</h3>
  <div id="status"><span class="dot" id="dot"></span><span id="msg">확인 중...</span></div>
  <script>
    async function check() {
      try {
        const r = await fetch('http://localhost:8765/bridge/poll', {signal: AbortSignal.timeout(2000)});
        document.getElementById('dot').className = 'dot green';
        document.getElementById('msg').textContent = 'MCP 서버 연결됨';
      } catch {
        document.getElementById('dot').className = 'dot red';
        document.getElementById('msg').textContent = 'MCP 서버 꺼져 있음';
      }
    }
    check();
  </script>
</body>
</html>
